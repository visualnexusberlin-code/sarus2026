# Cada push a main: construye dist/index.html y lo publica en Firebase Hosting.
name: Deploy SPEED RACING SKIES
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Publicar en Firebase (se salta si falta FIREBASE_PROJECT_ID)
        if: ${{ vars.FIREBASE_PROJECT_ID != '' || vars.SARUS2026 != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.SARUS2026 }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || vars.SARUS2026 }}
          channelId: live

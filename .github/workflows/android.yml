# App Android (Capacitor): compila un APK de prueba instalable (debug) con el juego entero dentro.
# Se lanza a mano (Actions → Android APK → Run workflow) o al subir cambios a la rama capacitor.
# Descarga: pestaña Actions → la ejecución → Artifacts → sarus-apk.
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [capacitor]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Salida web para la app (dist-app)
        run: node build.mjs --app
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: SDK de Android (preinstalado en el runner) y plataforma 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" | tail -2
      - name: Compilar APK (debug)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sarus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publicar el APK como versión de prueba (pestaña Releases → «APK de prueba»)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sarus-prueba.apk
          gh release delete apk-prueba --yes --cleanup-tag || true
          gh release create apk-prueba sarus-prueba.apk --prerelease --target "$GITHUB_SHA" --title "APK de prueba" --notes "SARUS · APK de prueba (debug), compilado desde $GITHUB_REF_NAME @ ${GITHUB_SHA::7}. Para instalarlo en Android: descargar y abrir el archivo, permitiendo instalar desde esta fuente."

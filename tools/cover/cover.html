<html><head><meta charset="utf-8"><title>SARUS cover</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// SARUS · portada: VEGA (modelo real del juego) cruzando sobre el limbo de la Tierra.
// Parámetros URL: w, h (px), shot = feature | wide | square
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 2048, H = +Q.get('h') || 1000, SHOT = Q.get('shot') || 'feature', ROLL = Q.get('roll');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x010204);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.35;
const camera = new THREE.PerspectiveCamera(26, W / H, 0.5, 200000);

// ── Sol: detrás del limbo, a la izquierda (amanecer orbital) ──
const SUN = new THREE.Vector3(-0.78, 0.05, -0.62).normalize();

// ── Estrellas ──
{
  const n = 9000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1).normalize().multiplyScalar(60000);
    pos.set([v.x, v.y, v.z], i * 3);
    const k = Math.pow(r(), 3) * 0.9 + 0.08, b = r();
    col.set([k * (0.8 + 0.2 * b), k * 0.88, k], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: W / 1100, sizeAttenuation: false, vertexColors: true, depthWrite: false })));
}

// ── La Tierra: noche y día, nubes, luces de ciudad en la zona oscura y el halo azul de la atmósfera ──
const ER = 9000, EC = new THREE.Vector3(1500, -9500, -9000);
const NOISE = `
  float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float n3(vec3 x){ vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);
    return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x), mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x), f.y),
               mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x), mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x), f.y), f.z); }
  float fbm(vec3 p){ float a = 0.0, w = 0.5; for (int i = 0; i < 7; i++) { a += n3(p) * w; p = p * 2.03 + 3.1; w *= 0.5; } return a; }`;
const earth = new THREE.Mesh(new THREE.SphereGeometry(ER, 256, 192), new THREE.ShaderMaterial({
  uniforms: { uSun: { value: SUN } },
  vertexShader: `varying vec3 vN; varying vec3 vO; varying vec3 vW; void main(){ vO = normalize(position); vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 uSun; varying vec3 vN; varying vec3 vO; varying vec3 vW; ${NOISE}
    void main(){
      vec3 n = normalize(vN), o = vO * 3.0, v = normalize(cameraPosition - vW);
      float land = fbm(o * 1.6 + 7.0) + 0.1 * fbm(o * 9.0);
      float isL = smoothstep(0.53, 0.56, land);
      vec3 ocean = mix(vec3(0.01, 0.05, 0.16), vec3(0.03, 0.14, 0.32), smoothstep(0.56, 0.45, land));
      vec3 ground = mix(vec3(0.10, 0.18, 0.07), vec3(0.38, 0.30, 0.18), smoothstep(0.4, 0.7, fbm(o * 4.0 + 2.0)));
      vec3 c = mix(ocean, ground, isL);
      float cl = smoothstep(0.58, 0.84, fbm(o * vec3(2.6, 6.0, 2.6) + 11.0) + 0.3 * fbm(o * 14.0));
      c = mix(c, vec3(0.95), cl * 0.9);
      float d = dot(n, uSun);
      float day = smoothstep(-0.08, 0.3, d);
      float city = isL * (1.0 - cl) * smoothstep(0.62, 0.8, fbm(o * 22.0)) * smoothstep(0.05, -0.2, d);
      vec3 col = c * day * 1.2 + vec3(1.0, 0.68, 0.32) * city * 0.9;
      float spec = pow(max(dot(reflect(-uSun, n), v), 0.0), 60.0) * (1.0 - isL) * (1.0 - cl) * day;
      col += vec3(1.0, 0.9, 0.75) * spec * 0.8;
      float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0);
      col += vec3(0.2, 0.5, 1.0) * rim * smoothstep(-0.35, 0.25, d) * 0.7;
      gl_FragColor = vec4(col, 1.0);
    }`,
}));
earth.position.copy(EC); scene.add(earth);
// halo: cáscara exterior aditiva (dispersión azul, más intensa hacia el sol)
const halo = new THREE.Mesh(new THREE.SphereGeometry(ER * 1.028, 256, 192), new THREE.ShaderMaterial({
  uniforms: { uSun: { value: SUN }, uC: { value: EC } }, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide,
  vertexShader: `varying vec3 vN; varying vec3 vW; void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 uSun; uniform vec3 uC; varying vec3 vN; varying vec3 vW;
    void main(){
      vec3 v = normalize(vW - cameraPosition);
      // distancia del rayo al centro: 1 en la superficie, 1.028 en el borde de la cáscara
      vec3 oc = cameraPosition - uC; float b = dot(oc, v); float h = length(oc - b * v) / ${ER.toFixed(1)};
      float t = clamp((1.028 - h) / 0.028, 0.0, 1.0);
      float dens = pow(t, 3.0) * smoothstep(0.992, 1.002, h) + 0.025 * smoothstep(0.9, 1.0, h) * step(h, 1.0);
      vec3 p = normalize(vW - uC);
      float lit = smoothstep(-0.45, 0.35, dot(p, uSun));
      float fwd = pow(max(dot(v, uSun), 0.0), 6.0);
      vec3 col = mix(vec3(0.12, 0.42, 1.0), vec3(0.55, 0.85, 1.0), t) * (0.25 + 1.6 * lit) + vec3(1.0, 0.75, 0.45) * fwd * lit * 0.6;
      gl_FragColor = vec4(col * dens * 0.55, 1.0);
    }`,
}));
halo.position.copy(EC); scene.add(halo);
// sol: destello rasante sobre el limbo
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const g = x.createRadialGradient(128,128,0,128,128,128); g.addColorStop(0,'rgba(255,250,240,1)'); g.addColorStop(0.06,'rgba(255,230,200,0.9)'); g.addColorStop(0.25,'rgba(120,180,255,0.18)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0,0,256,256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
scene.add(sunSprite);

// ── Luces ──
const key = new THREE.DirectionalLight(0xfff2e2, 3.4); key.position.copy(SUN).multiplyScalar(100); scene.add(key);
const earthFill = new THREE.DirectionalLight(0x5f9cff, 1.3); earthFill.position.set(0.2, -1, 0.3); scene.add(earthFill);
const rim = new THREE.DirectionalLight(0xbfe0ff, 2.2); rim.position.set(0.6, 0.4, -1); scene.add(rim);

// ── VEGA ──
const ION = new THREE.Color(0.45, 0.7, 1.0);
const ship = new THREE.Group(); scene.add(ship);
const gltf = await new GLTFLoader().loadAsync('/dist/ships41.glb');
const node = gltf.scene.getObjectByName('VEGA_13');
const model = node.clone(true); model.position.set(0, 0, 0); model.rotation.set(0, 0, 0); model.updateMatrixWorld(true);
const ionPts = [];
model.traverse((o) => {
  if (!o.isMesh) return;
  const mats = Array.isArray(o.material) ? o.material : [o.material];
  for (const m of mats) {
    if (/_Ion/.test(m.name)) { m.emissive?.copy(ION); m.color?.copy(ION); m.emissiveIntensity = 9; m.toneMapped = false;
      const p = o.geometry.attributes.position, v = new THREE.Vector3(); for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld); ionPts.push(v.clone()); } }
    if (/_Hover/.test(m.name)) { m.emissive?.copy(ION); m.emissiveIntensity = 3; }
    if (m.envMapIntensity !== undefined) m.envMapIntensity = 1.2;
  }
});
ship.add(model);
const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());
// toberas: agrupar los vértices de los discos de ion en tres centros (k-medias)
let cs = [ionPts[0], ionPts[Math.floor(ionPts.length / 2)], ionPts[ionPts.length - 1]].map((v) => v.clone());
for (let it = 0; it < 12; it++) {
  const acc = cs.map(() => [new THREE.Vector3(), 0]);
  for (const p of ionPts) { let b = 0, bd = 1e9; cs.forEach((c, k) => { const d = c.distanceToSquared(p); if (d < bd) { bd = d; b = k; } }); acc[b][0].add(p); acc[b][1]++; }
  cs = acc.map(([s, n], k) => n ? s.multiplyScalar(1 / n) : cs[k]);
}
const ionC = cs.reduce((a, c) => a.add(c), new THREE.Vector3()).multiplyScalar(1 / cs.length);
const back = Math.sign(ionC.z - box.getCenter(new THREE.Vector3()).z) || -1;   // hacia dónde salen las estelas
// estelas de ion: conos aditivos largos, núcleo blanco y halo azul
const trailMat = (core) => new THREE.ShaderMaterial({
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  uniforms: { uC: { value: ION.clone() }, uCore: { value: core } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 uC; uniform float uCore; varying vec2 vUv;
    void main(){ float along = vUv.y; float a = pow(along, 2.4) * (0.6 + 0.4 * sin(vUv.x * 6.2832 * 3.0 + along * 30.0) * 0.0 + 0.4);
      vec3 c = mix(uC, vec3(1.0), uCore * pow(along, 6.0)); gl_FragColor = vec4(c * a * (uCore > 0.5 ? 0.9 : 0.35), 1.0); }`,
});
for (const c of cs) {
  for (const [r, len, core] of [[0.12, 22, 1], [0.36, 14, 0], [0.8, 6, 0]]) {
    const g = new THREE.ConeGeometry(r, len, 24, 1, true);
    g.translate(0, -len / 2, 0); g.rotateX(back > 0 ? -Math.PI / 2 : Math.PI / 2);
    const m = new THREE.Mesh(g, trailMat(core)); m.position.copy(c); ship.add(m);
  }
  const fl = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: ION, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  fl.scale.setScalar(2.4); fl.position.copy(c).add(new THREE.Vector3(0, 0, back * 0.15)); ship.add(fl);
}
// ── Polvo en velocidad: trazos finos que pasan junto a la nave ──
{
  const n = 120, pos = new Float32Array(n * 6); let s = 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    const x = (r() - 0.5) * 70, y = (r() - 0.5) * 30, z = (r() - 0.5) * 140, L = 4 + r() * 18;
    pos.set([x, y, z, x, y, z + back * L], i * 6);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  ship.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x9cc8ff, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false })));
}

// ── Encuadre: la nave en diagonal ascendente (eco del logo), espacio libre para el logotipo ──
const cfg = {
  feature: { dir: [0.93, 0.22, 0.12], roll: 0.18, cam: [2.5, 5.2, 16.5], look: [-0.6, 0.4, 0], shipPos: [2.2, 0, 0] },
  wide:    { dir: [0.93, 0.22, 0.12], roll: 0.18, cam: [2.5, 5.4, 18], look: [-0.4, 0.6, 0], shipPos: [2.6, 0, 0] },
  diagA:   { dir: [1, 0, 0], roll: 0, cam: [6, 7, 12], look: [0, 0, 0], shipPos: [0, 0, 0] },
  diagB:   { dir: [1, 0, 0], roll: 0, cam: [0, 1, 14], look: [0, 0, 0], shipPos: [0, 0, 0] },
  square:  { dir: [0.9, 0.3, 0.2], roll: 0.18, cam: [2.0, 5.0, 14], look: [0.2, 0.8, 0], shipPos: [0.2, 0, 0] },
}[SHOT];
// el morro de la nave apunta a cfg.dir (sube hacia la derecha, como el trazo del logo); estela abajo a la izquierda
if (back > 0) { model.rotation.y = Math.PI; for (const c of ship.children) if (c !== model) { c.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI); c.rotateY(Math.PI); } }
ship.position.set(...cfg.shipPos);
const D = new THREE.Vector3(...cfg.dir).normalize();
ship.up.set(0, 1, 0); ship.lookAt(ship.position.clone().add(D)); ship.rotateZ(ROLL !== null ? +ROLL : cfg.roll);
camera.position.set(...cfg.cam); camera.lookAt(...cfg.look); camera.updateProjectionMatrix();
// sol justo sobre el limbo, a la izquierda del encuadre
sunSprite.position.copy(EC).addScaledVector(new THREE.Vector3(-0.42, 0.9, 0.12).normalize(), ER * 1.02);
sunSprite.scale.setScalar(ER * 0.15);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.85, 0.6, 0.82));
composer.addPass(new OutputPass());
composer.render();
window.__done = true;
</script></body></html>

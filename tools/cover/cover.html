  }
  const film = new THREE.Mesh(new THREE.CircleGeometry(ringR - 0.7, 96), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec2 vP; void main(){ float r = length(vP) / ${(ringR - 0.7).toFixed(2)};
      float a = 0.012 + 0.16 * pow(r, 8.0) + 0.015 * sin(r * 40.0) * r; gl_FragColor = vec4(vec3(0.35, 0.75, 1.0) * a, 1.0); }`,
  }));
  ring.add(film);
}

// sol justo sobre el limbo, a la izquierda del encuadre
sunSprite.position.copy(EC).addScaledVector(new THREE.Vector3(0.62, 0.78, 0.0).normalize(), ER * 1.02);
key.target.position.copy(ship.position); key.position.copy(ship.position).addScaledVector(SUN, 40);
sunSprite.scale.setScalar(ER * 0.15);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.7, 0.55, 0.85));
composer.addPass(new OutputPass());
// grading de portada: contraste en S, sombras frías, luces cálidas, viñeta, aberración en los bordes y grano fino
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(W, H) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uRes; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 dc = vUv - 0.5; float r2 = dot(dc, dc);
      vec2 off = dc * r2 * 0.012;
      vec3 c = vec3(texture2D(tDiffuse, vUv - off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv + off).b);
      float L = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(c, c * c * (3.0 - 2.0 * c), 0.35);
      c += vec3(-0.006, 0.0, 0.018) * (1.0 - smoothstep(0.0, 0.35, L));
      c *= mix(vec3(1.0), vec3(1.04, 1.0, 0.95), smoothstep(0.55, 1.0, L));
      c = mix(c, vec3(L), -0.08);
      c *= mix(1.0, smoothstep(0.95, 0.2, length(dc * vec2(1.0, 0.8))), 0.55);
      c += (hash(vUv * uRes) - 0.5) * 0.018;
      gl_FragColor = vec4(c, 1.0);
    }`,
}));
composer.render();
window.__done = true;
